services:
  - type: web
    name: async-api-engine
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_NAME
        value: AsyncAPI Engine
      - key: APP_VERSION
        value: 0.1.0
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: async-api-engine-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: async-api-engine-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "30"

  - type: keyvalue
    name: async-api-engine-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: async-api-engine-db
    databaseName: asyncapi_engine
    user: asyncapi
