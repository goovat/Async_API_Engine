name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: asyncapi
          POSTGRES_PASSWORD: asyncapi
          POSTGRES_DB: asyncapi_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U asyncapi -d asyncapi_engine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg://asyncapi:asyncapi@localhost:5432/asyncapi_engine
          REDIS_URL: redis://localhost:6379/0
        run: |
          alembic upgrade head

      - name: Run test suite
        env:
          DATABASE_URL: postgresql+psycopg://asyncapi:asyncapi@localhost:5432/asyncapi_engine
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key
        run: |
          pytest -q

      - name: Build Docker image
        run: |
          docker build -t async-api-engine:ci .
